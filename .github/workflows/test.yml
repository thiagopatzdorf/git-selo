# CI do espelho público thiagopatzdorf/git-selo. No monorepo da Genesis este arquivo não roda
# (lá os workflows vivem na raiz, em runner próprio); aqui é o repositório standalone, aberto,
# e o runner hospedado do GitHub é o que qualquer fork também tem.
name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # O age oficial é o juiz da paridade de formato (test/age-interop.test.mjs).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - run: npm test
      - run: node git-selo.mjs check --strict
