# Publica o git-selo no npm por Trusted Publishing (OIDC): sem token guardado em lugar nenhum, sem área de
# espera e com proveniência (o npm mostra que o pacote saiu deste repositório e deste workflow).
# Existe porque token com bypass de 2FA passou a cair na área de espera do npm a cada versão (medido em
# 21/11 com a 0.1.0 e a 0.2.0). Configuração única no npm: git-selo → Settings → Trusted Publisher →
# GitHub Actions, thiagopatzdorf / git-selo / publish.yml.
#
# Lançar: subir a versão no package.json e criar a tag vX.Y.Z no mesmo commit. Ensaio sem publicar:
# Actions → publish → Run workflow (dry_run = true).
name: publish
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only pack and show what would be published"
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write # o OIDC que o npm troca por uma credencial de uso único
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing exige npm >= 11.5.1; o do Node 22 é mais velho.
      - run: npm install -g npm@12.2.3 && npm --version
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - run: npm test
      # A tag tem de ser a versão do package.json: senão sai no npm um número que o código não diz.
      - name: tag = package.json version
        if: github.event_name == 'push'
        run: |
          v="$(node -p 'require("./package.json").version')"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
      - name: publish
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
